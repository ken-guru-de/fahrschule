<title>Fahrschule v2.1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
:root {
  --bg:#f2f2f7;--bg2:#e5e5ea;--bg3:#d8d8dd;
  --tx:#0a0a0a;--tx2:#555555;--tx3:#8e8e93;
  --br:rgba(0,0,0,0.10);--br2:rgba(0,0,0,0.18);
  --r-md:10px;--r-lg:16px;
  --accent:#FF6B2B;--accent2:#ff8c55;--accent-dark:#FF6B2B;--accent-tx:#ffffff;
  --ok-bg:#d4edbc;--ok-tx:#1e4208;--ok-solid:#27A843;
  --bad-bg:#fde8e8;--bad-tx:#8b1f1f;--bad-solid:#E24B4A;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.10);
  --shadow-md:0 4px 16px rgba(0,0,0,0.13);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.16);
  --safe-top:env(safe-area-inset-top,59px);--safe-bot:env(safe-area-inset-bottom,34px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111113;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --tx:#f5f5f7;--tx2:#aeaeb2;--tx3:#636366;
  --br:rgba(255,255,255,0.08);--br2:rgba(255,255,255,0.16);
  --shadow-sm:0 2px 8px rgba(0,0,0,0.40);
  --shadow-md:0 4px 16px rgba(0,0,0,0.50);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.60);
  --ok-bg:rgba(39,168,67,0.18);--ok-tx:#8fd99e;--ok-solid:#3ddc63;
  --bad-bg:rgba(226,75,74,0.18);--bad-tx:#ff9a9a;--bad-solid:#ff6b6b;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y;}
input,textarea,select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;overflow:hidden;touch-action:pan-y;position:fixed;width:100%;overscroll-behavior:none;}
.app{display:flex;flex-direction:column;height:100%;}
.screen{display:none;flex-direction:column;height:100%;}
.screen.active{display:flex;}
button{box-shadow:var(--shadow-sm);}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-top) + 10px) 20px 14px;background:linear-gradient(160deg,#FF8240 0%,#FF6B2B 60%,#e85510 100%);flex-shrink:0;min-height:52px;box-shadow:0 4px 20px rgba(255,107,43,0.45);}
.topbar-title{font-size:22px;font-weight:700;flex:1;color:white;letter-spacing:-.3px;}
.btn-icon{background:rgba(255,255,255,0.18);border:none;cursor:pointer;color:white;font-size:32px;display:flex;align-items:center;padding:8px;border-radius:14px;min-width:46px;min-height:46px;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.20),inset 0 1px 0 rgba(255,255,255,0.30);transition:background .12s;}
.btn-icon-label{background:rgba(255,255,255,0.18);border:none;cursor:pointer;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;border-radius:14px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,0.20),inset 0 1px 0 rgba(255,255,255,0.30);transition:background .12s;font-family:inherit;}
.btn-icon-label i{font-size:23px;}
.btn-icon-label span{font-size:10.5px;font-weight:700;letter-spacing:.03em;opacity:.95;}
.btn-icon-label:active{background:rgba(255,255,255,0.32);}
.btn-icon:active{background:rgba(255,255,255,0.30);}
.btn-icon.dark{color:var(--tx2);background:var(--bg2);box-shadow:var(--shadow-sm);}
.btn-icon.dark:active{background:var(--bg3);}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--safe-bot) + 24px);display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;touch-action:pan-y;}
.sec-label{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.card{background:var(--bg2);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);}
.card>.card-row:first-child,.card>.info-row:first-child,.card>.gfa-row:first-child,.card>.sonder-btn-row:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0;}
.card>.card-row:last-child,.card>.info-row:last-child,.card>.gfa-row:last-child,.card>.sonder-btn-row:last-child{border-radius:0 0 var(--r-lg) var(--r-lg);border-bottom:none;}
.card>.card-row:only-child,.card>.info-row:only-child{border-radius:var(--r-lg);border-bottom:none;}
@media(prefers-color-scheme:dark){.card{background:var(--bg2);}}
.card-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--br);min-height:52px;}
.card-row:last-child{border-bottom:none;}
.card-label{font-size:17px;color:var(--tx2);display:flex;align-items:center;gap:6px;min-width:130px;flex-shrink:0;}
.card-label i{font-size:17px;}
.card-row input,.card-row select,.card-row textarea{flex:1;border:none;background:transparent;font-size:17px;color:var(--tx);font-family:inherit;outline:none;text-align:right;}
.card-row input[type=text],.card-row input[type=tel],.card-row input[type=search],.card-row textarea{text-align:left;}
.card-row textarea{text-align:left;resize:none;}
.card-row select option{background:var(--bg);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--bg2);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow-sm);}
.stat-box.accent{background:linear-gradient(135deg,#FF8240,#e85510);box-shadow:0 6px 20px rgba(255,107,43,0.45);}
.stat-box.accent .stat-lbl{color:rgba(255,255,255,0.75);}
.stat-box.accent .stat-num{color:white;}
.stat-box.accent .stat-unit{color:rgba(255,255,255,0.65);}
.stat-glass-orange{background:linear-gradient(135deg,rgba(255,130,64,0.92),rgba(232,85,16,0.92));backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:0 14px 30px rgba(255,107,43,0.4),0 4px 10px rgba(255,107,43,0.22),inset 0 1.5px 0 rgba(255,222,195,0.55);border:1px solid rgba(255,255,255,0.22);}
.stat-glass-blue{background:rgba(10,40,120,0.10);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:0 12px 34px rgba(0,0,0,0.5),inset 0 1.5px 0 rgba(200,220,255,0.5);border:1px solid rgba(100,150,255,0.32);}
.stat-lbl{font-size:13px;font-weight:600;color:var(--tx3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;}
.stat-num{font-size:30px;font-weight:700;color:var(--tx);line-height:1.1;}
.monat-glas{position:relative;overflow:hidden;background:rgba(55,138,221,0.13);border:1px solid rgba(55,138,221,0.38);border-radius:var(--r-lg);backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);animation:monatGlow 3.2s ease-in-out infinite;}
@media(prefers-color-scheme:dark){.monat-glas{background:rgba(55,138,221,0.18);border-color:rgba(90,170,240,0.45);}}
.monat-glas>*{position:relative;z-index:1;}
.monat-glas::before{content:"";position:absolute;top:0;left:-60%;width:55%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,0.45),transparent);transform:skewX(-20deg);animation:monatSheen 4.2s ease-in-out infinite;z-index:0;pointer-events:none;}
.monat-betrag{display:inline-block;animation:monatPuls 2.4s ease-in-out infinite;}
@keyframes monatGlow{0%,100%{box-shadow:0 4px 18px rgba(55,138,221,0.18),inset 0 1px 0 rgba(255,255,255,0.35);}50%{box-shadow:0 8px 34px rgba(55,138,221,0.42),inset 0 1px 0 rgba(255,255,255,0.55);}}
@keyframes monatPuls{0%,100%{transform:scale(1);text-shadow:0 0 0 rgba(55,138,221,0);}50%{transform:scale(1.07);text-shadow:0 0 20px rgba(55,138,221,0.6);}}
@keyframes monatSheen{0%{left:-60%;}55%,100%{left:135%;}}
.stat-unit{font-size:14px;color:var(--tx2);font-weight:400;margin-left:2px;}
.list-item{background:var(--bg2);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--shadow-md);transition:all .12s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.list-item:active{box-shadow:none;opacity:.85;}
.list-item.lp-active{transform:scale(.97);opacity:.75;transition:transform .1s,opacity .1s;}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;box-shadow:var(--shadow-sm);touch-action:pan-y;overflow:hidden;}
.av-blue{background:#B5D4F4;color:#0C447C;}
.av-teal{background:#9FE1CB;color:#085041;}
.av-purple{background:#CECBF6;color:#3C3489;}
.av-coral{background:#F5C4B3;color:#712B13;}
.av-green{background:#C0DD97;color:#27500A;}
.av-amber{background:#FAC775;color:#633806;}
.item-name{display:flex;flex-direction:column;gap:0px;}
.item-name-first{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-name-last{font-size:15px;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:15px;color:var(--tx2);margin-top:3px;}
.item-info{flex:1;min-width:0;}
.badge{font-size:14px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0;letter-spacing:.02em;}
.badge-B{background:var(--accent-dark);color:white;}
.badge-BA{background:#e85510;color:white;}
.badge-B197{background:#c44000;color:white;}
.badge-B17{background:#27500A;color:white;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-blue{background:var(--accent);}
.search-wrap{position:relative;}
.search-wrap input{width:100%;height:46px;padding:0 14px 0 40px;border:1.5px solid var(--br2);border-radius:var(--r-lg);background:var(--bg2);color:var(--tx);font-size:18px;font-family:inherit;outline:none;box-shadow:var(--shadow-sm);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:21px;pointer-events:none;}
.btn-full{width:100%;padding:15px;background:var(--bg2);border:1.5px solid var(--br2);border-radius:var(--r-lg);font-size:20px;font-weight:600;color:var(--tx);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;box-shadow:var(--shadow-sm);}
.btn-full:active{transform:scale(.97);opacity:.85;}
.btn-full.gruen{background:var(--ok-bg);border-color:#7ab840;color:var(--ok-tx);}
.btn-full.rot{background:var(--bad-bg);border-color:#e07070;color:var(--bad-tx);}
.btn-full.danger{color:#E24B4A;border-color:#E24B4A;}
.fab-btn{background:none;border:none;cursor:pointer;color:var(--tx2);font-size:25px;display:flex;align-items:center;padding:4px;}
.toast{display:none;background:linear-gradient(135deg,#FF8240,#e85510);color:white;border:none;border-radius:var(--r-md);padding:10px 14px;font-size:15px;align-items:center;gap:8px;flex-shrink:0;box-shadow:var(--shadow-md);}.toast.show{display:flex;}
.toast.show{display:flex;}
.pill{padding:8px 16px;border-radius:20px;border:1.5px solid var(--br2);background:var(--bg2);font-size:17px;color:var(--tx2);cursor:pointer;font-family:inherit;min-height:44px;display:flex;align-items:center;box-shadow:var(--shadow-sm);}
.pill.active{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 3px 10px rgba(255,107,43,0.4);}
.farb-row{display:flex;gap:8px;justify-content:flex-end;flex:1;}
.farb-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.farb-dot.sel{border-color:var(--tx);box-shadow:var(--shadow-sm);}
.toggle-wrap{position:relative;width:51px;height:31px;flex-shrink:0;}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{position:absolute;inset:0;border-radius:16px;background:var(--bg3);border:1px solid var(--br2);cursor:pointer;transition:background .15s;}
.toggle-track.locked{cursor:not-allowed;opacity:.4;}
.toggle-thumb{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:white;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s;pointer-events:none;}
.toggle-wrap input:checked+.toggle-track{background:var(--accent);border-color:var(--accent);}
.toggle-wrap input:checked+.toggle-track+.toggle-thumb{transform:translateX(20px);}
.sonder-btn-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--br);}
.sonder-btn-row:last-child{border-bottom:none;}
.sonder-btn-row.done{background:rgba(255,107,43,.08);}
.sonder-btn-row.done .sonder-btn-label{color:var(--accent);}
.sonder-btn-label{font-size:15px;color:var(--tx2);display:flex;align-items:center;gap:8px;}
.sonder-btn-label i{font-size:17px;}
.sonder-progress{display:flex;border:1px solid var(--br);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
.sp-step{flex:1;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-align:center;border-right:1px solid var(--br);color:var(--tx3);}
.sp-step:last-child{border-right:none;}
.sp-step i{font-size:18px;}
.sp-step.done{background:linear-gradient(135deg,#FF8240,#e85510);color:white;}
.sp-step.next{background:rgba(255,107,43,.10);color:var(--accent);}
.info-row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--br);min-height:52px;}
.info-row:last-child{border-bottom:none;}
.info-lbl{font-size:17px;color:var(--tx2);display:flex;align-items:center;gap:6px;min-width:140px;}
.info-lbl i{font-size:16px;}
.info-val{font-size:17px;font-weight:600;flex:1;text-align:right;}
.pruef-card{background:linear-gradient(135deg,#FF8240,#e85510);border:none;border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-md);}
.pruef-result-item{background:var(--bg2);border-radius:var(--r-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.pruef-versuch{width:34px;height:34px;border-radius:50%;flex-shrink:0;font-size:16px;font-weight:800;text-align:center;line-height:34px;box-shadow:var(--shadow-sm);}
.pruef-best{background:var(--ok-bg);color:var(--ok-tx);}
.pruef-nicht{background:var(--bad-bg);color:var(--bad-tx);}
.gfa-row{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--br);}
.gfa-row:last-child{border-bottom:none;}
.gfa-label{flex:1;font-size:17px;font-weight:500;color:var(--tx);}
.gfa-controls{display:flex;align-items:center;gap:12px;}
.gfa-count{font-size:21px;font-weight:700;min-width:28px;text-align:center;color:var(--tx);}
.gfa-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--br2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--tx2);font-family:inherit;line-height:1;box-shadow:var(--shadow-sm);}
.gfa-btn:active{transform:scale(.88);background:var(--accent);color:white;border-color:var(--accent);}
.stat-card{background:var(--bg2);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm);}
.stat-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.stat-bar-label{font-size:14px;font-weight:600;color:var(--tx2);min-width:28px;}
.stat-bar-bg{flex:1;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden;}
.stat-bar-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,#FF8240,#e85510);}
.stat-bar-val{font-size:14px;font-weight:600;color:var(--tx2);min-width:28px;text-align:right;}
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--br);flex-shrink:0;background:var(--bg2);}
.month-label{font-size:20px;font-weight:700;}
.weekdays{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:10px 12px 4px;flex-shrink:0;}
.wd{text-align:center;font-size:14px;font-weight:600;letter-spacing:.03em;}
.cal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:4px 12px 12px;}
.cal-day{min-height:58px;border-radius:var(--r-md);padding:5px;cursor:pointer;border:.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;}
.cal-day:active{background:var(--bg2);}
.cal-day.today{border-color:var(--accent);background:var(--accent);}
.cal-day.sel{background:rgba(255,107,43,.15);border-color:var(--accent);}
.cal-day.disabled{cursor:default;opacity:.25;pointer-events:none;}
.day-num{font-size:17px;font-weight:500;color:var(--tx);line-height:1;text-align:center;width:100%;}
.cal-day.today .day-num{color:white;}
.dot-row{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
.cdot{width:6px;height:6px;border-radius:50%;}
.cdot-r{background:#E24B4A;}.cdot-g{background:#639922;}.cdot-b{background:#378ADD;}
.spacer-day{min-height:58px;}
.termin-item{background:var(--bg);border:.5px solid var(--br);border-radius:var(--r-lg);padding:9px 12px;display:flex;align-items:center;gap:10px;}
.t-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.t-info{flex:1;}
.t-name{font-size:15px;font-weight:500;}
.t-sub{font-size:13px;color:var(--tx2);margin-top:1px;}
.t-del{background:none;border:none;cursor:pointer;color:var(--tx3);font-size:18px;padding:3px;display:flex;align-items:center;}
.t-del:active{color:#E24B4A;}
.cir-btn{width:32px;height:32px;border-radius:50%;border:.5px solid var(--br2);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--tx2);font-family:inherit;line-height:1;touch-action:manipulation;}
.cir-btn:active{transform:scale(.93);}
.notiz-area{width:100%;min-height:200px;border:none;background:transparent;font-size:23px;line-height:1.7;color:var(--tx);font-family:inherit;outline:none;resize:none;padding:0;}
.empty-hint{text-align:center;padding:24px 0;font-size:15px;color:var(--tx3);}
.err-border{outline:2px solid #E24B4A !important;border-radius:4px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--safe-bot) + 20px);width:100%;max-width:520px;animation:slideup .2s ease;}
@keyframes slideup{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:20px;font-weight:700;margin-bottom:6px;color:var(--tx);}
.modal-msg{font-size:17px;color:var(--tx2);margin-bottom:20px;line-height:1.4;}
.modal-btns{display:flex;flex-direction:column;gap:8px;}
.modal-input-wrap{margin-bottom:16px;}
.modal-input-wrap textarea,.modal-input-wrap input[type=text]{width:100%;padding:12px;border:1.5px solid var(--br2);border-radius:var(--r-md);background:var(--bg);color:var(--tx);font-size:18px;font-family:inherit;outline:none;resize:none;-webkit-user-select:text;user-select:text;}
.foto-circle{width:80px;height:80px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;cursor:pointer;}
.foto-circle img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-circle .foto-overlay,.foto-initials .foto-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;border-radius:50%;}
.foto-circle:active .foto-overlay,.foto-initials:active .foto-overlay{opacity:1;}
.foto-overlay i{color:white;font-size:25px;}
.foto-initials{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:600;flex-shrink:0;cursor:pointer;position:relative;}
.swipe-wrap{position:relative;border-radius:var(--r-lg);margin-bottom:8px;}
.swipe-del-bg{position:absolute;right:0;top:0;bottom:0;width:80px;background:#E24B4A;display:flex;align-items:center;justify-content:center;color:white;font-size:25px;border-radius:0 var(--r-lg) var(--r-lg) 0;}
.swipe-item{position:relative;transition:transform .2s ease;touch-action:pan-y;background:var(--bg);border-radius:var(--r-lg);width:100%;z-index:1;}
.swipe-item.swiped{transform:translateX(-80px);}
.ptr-wrap{position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column;}
.ptr-indicator{position:absolute;top:-72px;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:center;transition:top .2s ease;z-index:10;pointer-events:none;background:rgba(255,107,43,.08);border-radius:0 0 20px 20px;}
.ptr-spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,107,43,.2);border-top-color:var(--accent);box-shadow:0 2px 8px rgba(255,107,43,.3);}
@keyframes ptr-spin{to{transform:rotate(360deg);}}
.ptr-spinner.spinning{animation:ptr-spin .7s linear infinite;}

/* ── IPAD OPTIMIERUNG ────────────────────────────────────────────────────────*/
@media (min-width: 768px) {
  body { background: var(--bg2); }
  .app { display: flex; flex-direction: row; height: 100vh; max-width: 100%; }
  #ipad-sidebar { width: 300px; min-width: 200px; max-width: 500px; flex-shrink: 0; border-right: 0.5px solid var(--br); display: flex; flex-direction: column; height: 100vh; background: var(--bg); position: relative; overflow: visible; }
  #ipad-resize-handle { position: absolute; right: -6px; top: 0; bottom: 0; width: 12px; cursor: col-resize; z-index: 100; background: transparent; display: flex; align-items: center; justify-content: center; }
  #ipad-resize-handle::after { content: ""; width: 4px; height: 40px; background: var(--br2); border-radius: 2px; transition: background 0.15s; }
  #ipad-resize-handle:hover::after { background: var(--accent); }
  #ipad-detail { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .screen { display: flex !important; flex-direction: column; height: 100vh; }

  .topbar { padding: calc(var(--safe-top) + 14px) 28px 14px; }
  .topbar-title { font-size:25px; }
  .btn-icon { font-size:28px; min-width: 48px; min-height: 48px; }

  .scroll { padding: 20px 28px calc(var(--safe-bot) + 28px); gap: 18px; }

  .stat-num { font-size:35px; }
  .stat-lbl { font-size:15px; }

  .list-item { padding: 16px 20px; min-height: 80px; gap: 16px; }
  .avatar { width: 54px; height: 54px; font-size:21px; }
  .item-name-first { font-size:22px; }
  .item-name-last { font-size:18px; }
  .item-sub { font-size:17px; margin-top: 5px; }
  .badge { font-size:16px; padding: 5px 12px; }

  .card-row { padding: 15px 20px; min-height: 58px; }
  .card-label { font-size:20px; min-width: 150px; }
  .card-row input, .card-row select, .card-row textarea { font-size:20px; }

  .info-row { padding: 14px 20px; min-height: 58px; }
  .info-lbl { font-size:20px; min-width: 160px; }
  .info-val { font-size:20px; }

  .btn-full { padding: 17px; font-size:22px; min-height: 60px; }

  .sec-label { font-size:15px; margin-bottom: 10px; }

  .gfa-row { padding: 14px 20px; }
  .gfa-label { font-size:20px; }
  .gfa-count { font-size:23px; }
  .gfa-btn { width: 36px; height: 36px; font-size:23px; }

  .notiz-area { font-size:25px; min-height: 240px; }

  .cal-day { min-height: 68px; }
  .day-num { font-size:20px; }
  .wd { font-size:16px; }
  .month-label { font-size:23px; }

  .cir-btn { width: 36px; height: 36px; font-size:23px; }
  .pill { font-size:18px; padding: 9px 18px; }

  .foto-circle, .foto-initials { width: 90px; height: 90px; font-size:30px; }
  .detail-avatar { width: 60px; height: 60px; font-size:23px; }

  .sonder-btn-label { font-size:17px; }
  .sp-step { font-size:14px; padding: 10px 8px; }
  .sp-step i { font-size:21px; }

  .search-wrap input { height: 50px; font-size:21px; }
  .search-icon { font-size:23px; }

  .toggle-wrap { width: 56px; height: 34px; }
  .toggle-thumb { width: 28px; height: 28px; }
  .toggle-wrap input:checked + .toggle-track + .toggle-thumb { transform: translateX(22px); }

// ── HORIZONTALES VERSCHIEBEN HART UNTERBINDEN ─────────────────────────────────
// CSS touch-action reicht in der iOS-Standalone-PWA nicht immer aus, um jegliches
// seitliches "Geben" des Bildschirms zu verhindern. Deshalb zusätzlich per JS:
// Bei einer überwiegend horizontalen Fingerbewegung wird die native Aktion verhindert.
// Ausnahmen: Swipe-to-delete (.swipe-item) und der Foto-Zuschneide-Editor.
(function(){
  let sx=0, sy=0, locked=null, skip=false;
  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1){skip=true;return;}
    skip=!!(e.target.closest(".swipe-item")||e.target.closest("#foto-edit-img"));
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;locked=null;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(skip||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(locked===null&&(Math.abs(dx)>4||Math.abs(dy)>4)){locked=Math.abs(dx)>Math.abs(dy)?"x":"y";}
    if(locked==="x")e.preventDefault();
  },{passive:false});
})();

function showModal({title="",msg="",btns=[],input=null,onOpen=null}){

  }</div>`:"";
  const btnsHtml=btns.map(b=>`<button onclick="${b.action}" style="width:100%;padding:15px;border-radius:var(--r-md);border:${b.danger?'1.5px solid var(--bad-solid)':'1.5px solid var(--br2)'};background:${b.danger?'var(--bad-bg)':b.primary?'var(--accent)':'var(--bg)'};color:${b.danger?'var(--bad-tx)':b.primary?'white':'var(--tx)'};font-size:20px;font-weight:600;cursor:pointer;font-family:inherit">${b.label}</button>`).join("");
  const div=document.createElement("div");
  div.id="fs-modal";
  div.className="modal-overlay";
  div.innerHTML=`<div class="modal-sheet"><div class="modal-title">${title}</div><div class="modal-msg">${msg}</div>${inputHtml}<div class="modal-btns">${btnsHtml}</div></div>`;
  div.addEventListener("click",e=>{if(e.target===div)closeModal();});

}

function normalizePhone(phone){
  if(!phone) return "";
  let p=String(phone).trim().replace(/[^\d+]/g,'');
  if(p.startsWith('0049')) p='+49'+p.slice(4);
  else if(p.startsWith('0')) p='+49'+p.slice(1);
  return p;
}
function openWhatsAppPhone(phone,msg=''){
  const tel=normalizePhone(phone).replace('+','');
  let url='https://wa.me/'+tel;
  if(msg) url+='?text='+encodeURIComponent(msg);
  window.open(url,'_blank');
}

  const nowMin=now.getHours()*60+now.getMinutes();
  const [h,m]=uhr.split(":").map(Number);
  return (h*60+m+(min||0))<=nowMin;
}
function _adjWeekday(dateStr,dir){const d=new Date(dateStr);do{d.setDate(d.getDate()+dir);}while(d.getDay()===0||d.getDay()===6);return toKey(d.getFullYear(),d.getMonth()+1,d.getDate());}

      if(s2.pruefungen&&s2.pruefungen.some(p=>p.bestanden===true))return;
      allePruef.push({sid:t.sid,datum,versuch:(s2.pruefungen||[]).length+1,bestanden:null,prufort:s2.prufort||""});
    });
  });
  allePruef.sort((a,b)=>a.datum.localeCompare(b.datum));
  // Nur eine Prüfung pro Schüler anzeigen (die nächste)
  const _pruefPerSid=new Map();

    if(!_pruefPerSid.has(p.sid)){_pruefPerSid.set(p.sid,true);allePruefFiltered.push(p);}
  });
  allePruef.length=0;allePruefFiltered.forEach(p=>allePruef.push(p));

  // Woche/Monat-Übersicht wird nur noch in der Abrechnung berechnet, hier nicht mehr benötigt

  let html=`<div class="screen active" id="scr-dash">
    <div class="topbar">
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px">
        <button class="btn-icon-label" onclick="${fixedDate?"buildKalender()":"renderKalender()"}"><i class="ti ti-calendar"></i><span>Kalender</span></button>
        <button class="btn-icon-label" onclick="renderSchuelerListe()"><i class="ti ti-users"></i><span>Schüler</span></button>
        <button class="btn-icon-label" onclick="renderStatistik()"><i class="ti ti-chart-bar"></i><span>Statistik</span></button>
        <button class="btn-icon-label" onclick="toggleDatenMenu()"><i class="ti ti-device-floppy"></i><span>Backup</span></button>
      </div>
    </div>
    <div class="scroll">
      <div class="stat-box stat-glass-blue" style="cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-left:12px" onclick="renderAbrechnung()">
        <div class="stat-num" id="ddb-min" style="font-size:42px;flex-shrink:0">0<span class="stat-unit">min</span></div>
        <div id="ddb-eur" style="font-size:20px;font-weight:700;color:#378ADD">0,00&nbsp;€</div>
      </div>`;

  // Find display date based on offset
  let anzeigeDatum=td;
  let anzeigeLabel="Heute";
  if(fixedDate){
    anzeigeDatum=fixedDate;
    const fd2=fmtDate(anzeigeDatum);
    anzeigeLabel=anzeigeDatum===td?"Heute":wochentagKurz(anzeigeDatum)+", "+fd2.day+". "+fd2.mon;
  } else if(dashDateOffset===0&&!heuteTermine.length){
    const alleKeys=Object.keys(termine).filter(d=>d>td).sort();

      anzeigeLabel=wochentagKurz(anzeigeDatum)+", "+fd2.day+". "+fd2.mon;
    }
  } else if(dashDateOffset!==0){
    // Navigate by working days
    const allKeys=Object.keys(termine).filter(d=>{const day=new Date(d).getDay();return day>=1&&day<=5;}).sort();
    const todayIdx=allKeys.findIndex(d=>d>=td);
    const targetIdx=Math.max(0,Math.min(allKeys.length-1,(todayIdx<0?allKeys.length-1:todayIdx)+dashDateOffset));
    if(allKeys[targetIdx]){

    const totalPx=Math.round((rangeEnd-rangeStart)*PX_PER_MIN);
    const _GUTTER=40;

    // Stunden-Gitter
    let gridHtml="";

      const top=Math.round((m-rangeStart)*PX_PER_MIN);

    // Jetzt-Linie (nur wenn heutiger Tag angezeigt wird und die Uhrzeit im sichtbaren Bereich liegt)

      const _now=new Date();

        const top=Math.round((nowMin-rangeStart)*PX_PER_MIN);

        nowHtml=`<div id="now-line" style="position:absolute;top:${top}px;left:${_GUTTER}px;right:0;height:0;border-top:2px solid #E24B4A;z-index:5;pointer-events:none">

  },10);
  if(window._nowLineInterval)clearInterval(window._nowLineInterval);

function _updateNowLine(){
  const cont=document.getElementById("timeline-container");
  const line=document.getElementById("now-line");
  if(!cont||!line){if(window._nowLineInterval)clearInterval(window._nowLineInterval);return;}
  const rangeStart=parseFloat(cont.dataset.rangeStart);
  const rangeEnd=parseFloat(cont.dataset.rangeEnd);
  const pxPerMin=parseFloat(cont.dataset.pxPerMin);
  const _now=new Date();
  const nowMin=_now.getHours()*60+_now.getMinutes();
  if(nowMin<rangeStart||nowMin>rangeEnd){clearInterval(window._nowLineInterval);return;}
  const top=Math.round((nowMin-rangeStart)*pxPerMin);
  line.style.top=top+"px";
  const lbl=line.nextElementSibling;
  if(lbl){lbl.style.top=(top-8)+"px";lbl.textContent=String(_now.getHours()).padStart(2,"0")+":"+String(_now.getMinutes()).padStart(2,"0");}
}

// ── SCHÜLER LISTE HELPER ──────────────────────────────────────────────────────
function _nextTerminDT(s){
  const td=todayStr();
  const nowDT=(()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")+"T"+String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");})();
  const all=Object.entries(termine)
    .filter(([d])=>d>=td)
    .flatMap(([d,ts])=>ts.filter(t=>t.sid===s.id).map(t=>d+"T"+(t.uhr||"00:00")))
    .filter(dt=>dt>=nowDT);
  return all.sort()[0]||"9999";
}

function _schuelerCardHTML(s,heuteIds,sortMode){
  const td=todayStr();
  const bestanden=(s.pruefungen||[]).some(p=>p.bestanden===true);
  const dotColor=bestanden?"#639922":"var(--accent)";
  const nextDT=_nextTerminDT(s);
  let subLine;
  if(sortMode==="termin"){
    if(nextDT==="9999"){subLine="Kein Termin geplant";}
    else{const nd=nextDT.split("T")[0];const t=(termine[nd]||[]).find(t=>t.sid===s.id);subLine=fmtDate(nd).day+". "+fmtDate(nd).mon+" "+fmtDate(nd).year+(t?" · "+t.uhr+" Uhr":"");}
  }else{
    subLine="Beginn "+fmtDate(s.beginn).day+". "+fmtDate(s.beginn).mon+" "+fmtDate(s.beginn).year;
  }
  const gefahren=Object.entries(termine).flatMap(([d,ts])=>ts.filter(t=>t.sid===s.id&&_terminVorbei(d,t.uhr,t.min))).length;
  const offen=Object.entries(termine).flatMap(([d,ts])=>ts.filter(t=>t.sid===s.id&&!_terminVorbei(d,t.uhr,t.min))).length;
  const avatarHTML=s.foto
    ?`<div class="avatar" style="overflow:hidden;flex-shrink:0"><img src="${s.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/></div>`
    :`<div class="avatar av-${s.farbe}">${initials(s)}</div>`;
  return`<div class="swipe-wrap" id="wrap-${s.id}">
    <div class="swipe-del-bg" onclick="confirmDelete('${s.id}')"><i class="ti ti-trash"></i></div>
    <div class="swipe-item list-item" id="swipe-${s.id}" onclick="handleTap('${s.id}')" style="${bestanden?"border-left:3px solid #639922;":""}">
      ${avatarHTML}
      <div class="item-info">
        <div class="item-name">${s.vorname} ${s.nachname}${s.spitz?` <span style="color:var(--tx3);font-size:14px">«${s.spitz}»</span>`:""}</div>
        ${bestanden?`<div style="margin-top:3px"><span style="font-size:13px;color:var(--ok-tx);background:var(--ok-bg);padding:2px 8px;border-radius:20px">✓ Bestanden</span></div>`:""}
        <div class="item-sub">${subLine}</div>
        <div style="font-size:14px;color:var(--tx3);margin-top:2px;white-space:nowrap">${gefahren} gefahren · ${offen} geplant</div>
      </div>
      <span class="badge badge-${s.klasse}">${s.klasse}</span>
      <span class="status-dot" style="background:${dotColor}"></span>
    </div>
  </div>`;
}

// ── SCHÜLERLISTE (Alle / Aktive / Nächste Termine) ───────────────────────────
function renderSchuelerListe(mode="aktive",q=""){
  const td=todayStr();
  const heuteIds=new Set((termine[td]||[]).map(t=>t.sid));
  let basis=q?schueler.filter(s=>(s.vorname+" "+s.nachname+" "+(s.spitz||"")).toLowerCase().includes(q.toLowerCase())):schueler;
  if(mode==="aktive")basis=basis.filter(s=>!(s.pruefungen||[]).some(p=>p.bestanden===true));
  const filtered=[...basis].sort((a,b)=>{
    if(mode==="alle")return a.nachname.localeCompare(b.nachname,"de");
    return _nextTerminDT(a).localeCompare(_nextTerminDT(b));
  });
  const modes=[{key:"alle",label:"Alle Schüler"},{key:"aktive",label:"Aktive Schüler"},{key:"naechste",label:"Nächste Termine"}];
  let html=`<div class="screen active" id="scr-liste">

      <button class="btn-icon" onclick="renderDashboard()"><i class="ti ti-arrow-left"></i></button>

    </div>
    <div class="scroll">
      <div style="display:flex;gap:6px;margin-bottom:10px">
        ${modes.map(m=>`<button onclick="renderSchuelerListe('${m.key}','${q}')" style="flex:1;padding:9px 4px;border-radius:10px;border:none;font-size:13px;font-weight:${mode===m.key?700:400};cursor:pointer;font-family:inherit;background:${mode===m.key?'var(--accent)':'rgba(255,107,43,.08)'};color:${mode===m.key?'white':'var(--tx2)'}">${m.label}</button>`).join('')}
      </div>
      <div class="search-wrap">
        <i class="ti ti-search search-icon"></i>
        <input type="search" placeholder="Suchen…" value="${q}" oninput="filterListeOnly(this.value,'${mode}')" id="search-input" style="padding-right:${q?'40px':'12px'}"/>
        <button class="search-clear-x" onclick="renderSchuelerListe('${mode}','')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--tx3);font-size:21px;display:${q?'flex':'none'};align-items:center;padding:4px"><i class="ti ti-x"></i></button>
      </div>
      <div id="liste-items">`;
  if(!filtered.length){
    html+=`<div class="empty-hint"><i class="ti ti-search" style="font-size:32px;display:block;margin:0 auto 8px"></i>Keine Schüler gefunden</div>`;
  }else{
    filtered.forEach(s=>{html+=_schuelerCardHTML(s,heuteIds,mode==="alle"?"alpha":"termin");});
  }

}


function filterListeOnly(q, mode){
  const container=document.getElementById("liste-items");
  if(!container){renderSchuelerListe(mode,q);return;}

  const clearBtns=document.querySelectorAll(".search-clear-x");
  clearBtns.forEach(b=>b.style.display=q?"flex":"none");

  const td=todayStr();
  const heuteIds=new Set((termine[td]||[]).map(t=>t.sid));
  let basis=q?schueler.filter(s=>(s.vorname+" "+s.nachname+" "+(s.spitz||"")).toLowerCase().includes(q.toLowerCase())):schueler;
  if(mode==="aktive")basis=basis.filter(s=>!(s.pruefungen||[]).some(p=>p.bestanden===true));

  const filtered=[...basis].sort((a,b)=>{
    if(mode==="alle")return a.nachname.localeCompare(b.nachname,"de");
    return _nextTerminDT(a).localeCompare(_nextTerminDT(b));
  });

  let html="";
  if(!filtered.length){
    html=`<div class="empty-hint"><i class="ti ti-search" style="font-size:32px;display:block;margin:0 auto 8px"></i>Keine Schüler gefunden</div>`;
  }else{
    filtered.forEach(s=>{html+=_schuelerCardHTML(s,heuteIds,mode==="alle"?"alpha":"termin");});
  }
  container.innerHTML=html;
  initSwipe();
}

function initSwipe(){
  document.querySelectorAll(".swipe-item").forEach(el=>{
    const sid=el.id.replace("swipe-","");
    let startX,startY,dragging=false,locked=false;
    el.addEventListener("touchstart",e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;dragging=false;locked=false;},{passive:true});
    el.addEventListener("touchmove",e=>{
      if(locked)return;
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      if(!dragging){
        if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){locked=true;return;}
        if(Math.abs(dx)<10||Math.abs(dx)<=Math.abs(dy))return;
      }
      dragging=true;
      const base=el.classList.contains("swiped")?-80:0;
      el.style.transition="none";
      el.style.transform=`translateX(${Math.max(Math.min(base+dx,0),-80)}px)`;
    },{passive:true});
    el.addEventListener("touchend",e=>{
      if(!dragging)return;
      const dx=e.changedTouches[0].clientX-startX;
      el.style.transition="transform .2s ease";
      if(el.classList.contains("swiped")){if(dx>30){el.style.transform="translateX(0)";el.classList.remove("swiped");}else el.style.transform="translateX(-80px)";}
      else{if(dx<-30){el.style.transform="translateX(-80px)";el.classList.add("swiped");}else el.style.transform="translateX(0)";}
      setTimeout(()=>{el.style.transition="";dragging=false;},220);
    });
  });
}
function handleTap(sid){
  const el=document.getElementById("swipe-"+sid);
  if(el&&el.classList.contains("swiped")){el.style.transition="transform .2s ease";el.style.transform="translateX(0)";el.classList.remove("swiped");return;}
  renderDashSchueler(sid);

function handleDashTerminTap(elId,sid,returnDate){

function handleTagTerminTap(elId,date,idx){

function showFotoEditor(sid){
  const s=getS(sid);if(!s||!s.foto)return;
  const existing=document.getElementById("fs-modal");if(existing)existing.remove();
  const div=document.createElement("div");
  div.id="fs-modal";div.className="modal-overlay";div.style.alignItems="center";
  div.innerHTML=`<div class="modal-sheet" style="border-radius:20px;max-width:360px;margin:16px">
    <div class="modal-title" style="margin-bottom:12px">Ausschnitt anpassen</div>
    <div style="position:relative;width:240px;height:240px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid var(--accent);background:#000">
      <img id="foto-edit-img" src="${s.foto}" style="position:absolute;transform-origin:center center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none"/>
    </div>
    <div style="margin-bottom:8px">
      <div style="font-size:14px;color:var(--tx3);margin-bottom:6px;text-align:center">Zoom</div>
      <input type="range" id="foto-zoom" min="50" max="200" value="100" style="width:100%;accent-color:var(--accent)"/>
    </div>
    <div class="modal-btns" style="margin-top:16px">
      <button onclick="applyFotoEdit('${sid}')" style="width:100%;padding:15px;border-radius:var(--r-md);border:none;background:var(--accent);color:white;font-size:20px;font-weight:600;cursor:pointer;font-family:inherit">Speichern</button>
      <button onclick="closeModal()" style="width:100%;padding:15px;border-radius:var(--r-md);border:1.5px solid var(--br2);background:var(--bg);color:var(--tx);font-size:20px;font-weight:600;cursor:pointer;font-family:inherit">Abbrechen</button>
    </div>
  </div>`;
  div.addEventListener("click",e=>{if(e.target===div)closeModal();});
  document.body.appendChild(div);
  setTimeout(()=>{
    const img=document.getElementById("foto-edit-img");
    const zoom=document.getElementById("foto-zoom");
    if(!img||!zoom)return;
    let ox=0,oy=0,startX=0,startY=0,dragging=false;
    function applyTransform(){img.style.transform=`translate(${ox}px,${oy}px) scale(${zoom.value/100})`;}
    img.onload=function(){
      const iw=img.naturalWidth,ih=img.naturalHeight;
      const fit=Math.max(240/iw,240/ih);
      zoom.value=Math.round(fit*100);
      img.style.width=iw+"px";img.style.height=ih+"px";
      img.style.left=((240-iw)/2)+"px";img.style.top=((240-ih)/2)+"px";
      applyTransform();
    };
    if(img.complete&&img.naturalWidth)img.onload();
    zoom.addEventListener("input",applyTransform);
    img.addEventListener("touchstart",e=>{e.preventDefault();dragging=true;startX=e.touches[0].clientX-ox;startY=e.touches[0].clientY-oy;},{passive:false});
    img.addEventListener("touchmove",e=>{e.preventDefault();if(!dragging)return;ox=e.touches[0].clientX-startX;oy=e.touches[0].clientY-startY;applyTransform();},{passive:false});
    img.addEventListener("touchend",()=>{dragging=false;});
    img.addEventListener("mousedown",e=>{dragging=true;startX=e.clientX-ox;startY=e.clientY-oy;img.style.cursor="grabbing";});
    document.addEventListener("mousemove",e=>{if(!dragging)return;ox=e.clientX-startX;oy=e.clientY-startY;applyTransform();});
    document.addEventListener("mouseup",()=>{dragging=false;img.style.cursor="grab";});
  },100);
}
function applyFotoEdit(sid){
  const img=document.getElementById("foto-edit-img");
  const zoom=document.getElementById("foto-zoom");
  if(!img)return;
  const sc=zoom?zoom.value/100:1;
  const match=(img.style.transform||"").match(/translate\(([^,]+)px,([^p]+)px\)/);
  const ox=match?parseFloat(match[1]):0;
  const oy=match?parseFloat(match[2]):0;
  const iw=img.naturalWidth,ih=img.naturalHeight;
  const imgLeft=(240-iw)/2,imgTop=(240-ih)/2;
  const screenX=imgLeft+ox,screenY=imgTop+oy;
  const SIZE=300;
  const canvas=document.createElement("canvas");
  canvas.width=SIZE;canvas.height=SIZE;
  canvas.getContext("2d").drawImage(img,-screenX/sc,-screenY/sc,240/sc,240/sc,0,0,SIZE,SIZE);
  const s=getS(sid);if(s){s.foto=canvas.toDataURL("image/jpeg",.85);saveAll();closeModal();renderSchueler(sid);showToast("toast-main","Foto gespeichert");}
}
function saveFoto(sid,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement("canvas");
      const minSide=Math.min(img.width,img.height);
      const sx=(img.width-minSide)/2,sy=(img.height-minSide)/2;
      const outSize=Math.min(minSide,400);
      canvas.width=outSize;canvas.height=outSize;
      canvas.getContext("2d").drawImage(img,sx,sy,minSide,minSide,0,0,outSize,outSize);
      const s=getS(sid);if(s){s.foto=canvas.toDataURL("image/jpeg",.85);saveAll();renderSchueler(sid);showToast("toast-main","Foto gespeichert");}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderCalGrid(){
  const grid=document.getElementById("cal-grid");if(!grid)return;
  grid.innerHTML="";
  const td=todayStr();
  const dim=new Date(curYear,curMonth,0).getDate();
  // collect only weekdays
  const weekdays=[];
  for(let d=1;d<=dim;d++)if(isWeekday(curYear,curMonth,d))weekdays.push(d);
  if(!weekdays.length)return;
  // offset: what weekday (Mon=0) is the first weekday of the month
  const firstDow=(new Date(curYear,curMonth-1,weekdays[0]).getDay()+6)%7;
  for(let i=0;i<firstDow;i++){const sp=document.createElement("div");sp.className="spacer-day";grid.appendChild(sp);}
  for(let d=1;d<=dim;d++){
    if(!isWeekday(curYear,curMonth,d))continue;
    const isWE=false;
    const key=toKey(curYear,curMonth,d);
    const el=document.createElement("div");el.className="cal-day";
    if(isBefore(curYear,curMonth,d))el.classList.add("disabled");
    if(key===td)el.classList.add("today");
    if(key===selDate)el.classList.add("sel");
    const dn=document.createElement("div");dn.className="day-num";dn.textContent=d;el.appendChild(dn);
    const t=termine[key];
    if(t&&t.length){

        const dot=document.createElement("div");

        dr.appendChild(dot);

function _removeOffenePruefungFuerTermin(t,date){
  if(!t||t.typ!=="pruef"||!t.sid||t.sid.startsWith("__auffrisch__"))return;

  if(!ps||!ps.pruefungen)return;
  const idx=ps.pruefungen.findIndex(p=>p.datum===date&&(p.bestanden===null||p.bestanden===undefined));
  if(idx>=0)ps.pruefungen.splice(idx,1);

function _deleteTerminData(date,idx,pushTrash){
  if(!termine[date]||!termine[date][idx])return null;
  const t=termine[date][idx];
  if(pushTrash)_pushTerminTrash(date,t);
  _removeOffenePruefungFuerTermin(t,date);
  termine[date].splice(idx,1);
  if(!termine[date].length)delete termine[date];
  saveAll();
  return t;
}

function changeKalMin(d){AppState.kal.min=Math.max(5,Math.min(300,AppState.kal.min+d));const el=document.getElementById("kal-min-disp");if(el)el.textContent=AppState.kal.min+" min";}

function setKTyp(typ){
  AppState.kal.typ=typ;
  ["normal","pruef","ueberland","autobahn","nacht","auffrisch"].forEach(t=>{const el=document.getElementById("ktyp-"+t);if(el)el.classList.toggle("active",t===typ);});
  if(typ==="normal")AppState.kal.min=80;
  else if(typ==="pruef")AppState.kal.min=100;
  else if(typ==="ueberland")AppState.kal.min=270;
  else if(typ==="autobahn")AppState.kal.min=225;
  else if(typ==="nacht")AppState.kal.min=135;
  else if(typ==="auffrisch")AppState.kal.min=80;
  const el=document.getElementById("kal-min-disp");if(el)el.textContent=AppState.kal.min+" min";
  const pf=document.getElementById("kal-prufort-row");
  if(pf)pf.style.display=typ==="pruef"?"":"none";
  kalUpdateEnd();
}

function setKSonder(key,min){
  SONDER.forEach(sf=>{const el=document.getElementById("ksf-"+sf.key);if(el)el.classList.toggle("active",sf.key===key);});
  AppState.kal.min=min;AppState.kal.sonderKey=key;
  const el=document.getElementById("kal-min-disp");if(el)el.textContent=min+" min";
  kalUpdateEnd();
}

function kalUpdateEnd(){
  const uhr=document.getElementById("k-uhr");
  const endEl=document.getElementById("k-endzeit");
  if(!uhr||!endEl)return;
  const [h,m]=uhr.value.split(":").map(Number);
  const total=h*60+m+(AppState.kal.min||80);
  const eh=Math.floor(total/60)%24;
  const em=total%60;
  endEl.textContent=String(eh).padStart(2,"0")+":"+String(em).padStart(2,"0")+" Uhr";
}
function toggleKalAlleSchueler(){
  AppState.kal.alleSchueler=!AppState.kal.alleSchueler;
  const sel=document.getElementById("k-sid");
  const btn=document.getElementById("k-alle-btn");
  if(!sel)return;
  const list=AppState.kal.alleSchueler?[...schueler]:schueler.filter(s=>!(s.pruefungen||[]).some(p=>p.bestanden===true));
  sel.innerHTML='<option value="">Auswählen…</option>'+list.map(s=>'<option value="'+s.id+'">'+s.vorname+' '+s.nachname+(s.spitz?' «'+s.spitz+'»':'')+'</option>').join('');
  if(btn)btn.textContent=AppState.kal.alleSchueler?'− Nur aktive Schüler anzeigen':'+ Auch bestandene Schüler anzeigen';
}

function setKPers(typ){
  AppState.kal.pers=typ;
  document.getElementById("kpers-schueler").classList.toggle("active",typ==="schueler");
  document.getElementById("kpers-auffrisch").classList.toggle("active",typ==="auffrisch");
  var thBtn=document.getElementById("kpers-theorie");if(thBtn)thBtn.classList.toggle("active",typ==="theorie");
  document.getElementById("k-schueler-row").style.display=typ==="schueler"?"":"none";
  document.getElementById("k-auffrisch-row").style.display=typ==="auffrisch"?"":"none";
  var thRow=document.getElementById("k-theorie-row");if(thRow)thRow.style.display=typ==="theorie"?"":"none";

function saveKalTermin(date){
  try{
  const uhr=document.getElementById("k-uhr")?document.getElementById("k-uhr").value:"";
  if(!uhr){showToast("toast-kal","Bitte Startzeit eingeben");return;}
  const persMode=AppState.kal.pers||"schueler";
  const isAuffrisch=persMode==="auffrisch";
  const isTheorie=persMode==="theorie";
  let sid;
  if(isTheorie){
    const tEl=document.getElementById("k-theorie-titel");
    const titel=tEl&&tEl.value.trim()?tEl.value.trim():"Theoriestunde";
    if(!termine[date])termine[date]=[];
    const tnotizEl=document.getElementById('k-notiz');const tnotiz=tnotizEl?tnotizEl.value.trim():'';
    termine[date].push({sid:"__theorie__:"+titel,uhr,min:AppState.kal.min||90,notiz:tnotiz,typ:"theorie"});
    termine[date].sort((a,b)=>a.uhr.localeCompare(b.uhr));
    saveAll();selDate=date;renderTagAnsicht(date);return;
  }
  if(!isAuffrisch){
    sid=document.getElementById("k-sid")?document.getElementById("k-sid").value:"";
    if(!sid){
      const el=document.getElementById("k-sid");
      if(el){el.classList.add("err-border");setTimeout(()=>el.classList.remove("err-border"),1500);}
      showToast("toast-kal","Bitte Schüler auswählen");
      return;
    }
  } else {
    const nameEl=document.getElementById("k-auffrisch-name");
    const name=nameEl?nameEl.value.trim():"";
    if(!name){
      if(nameEl){nameEl.classList.add("err-border");setTimeout(()=>nameEl.classList.remove("err-border"),1500);}
      showToast("toast-kal","Bitte Namen eingeben");
      return;
    }
    sid="__auffrisch__:"+name;
  }
  const min=AppState.kal.min||80;
  if(!termine[date])termine[date]=[];
  const knotiz=document.getElementById('k-notiz');const notizVal=knotiz?knotiz.value.trim():'';
  const ksf2=AppState.kal.sonderKey;const ktyp2=AppState.kal.typ||'normal';
  const autoN=ktyp2==='pruef'?'Prüfung':ktyp2==='auffrisch'?'Auffrischung':ktyp2==='ueberland'?'Überlandfahrt':ktyp2==='autobahn'?'Autobahnfahrt':ktyp2==='nacht'?'Nachtfahrt':'';
  // Store typ in termin for reliable sync
  const kalTypStr=ktyp2;
  termine[date].push({sid,uhr,min,notiz:notizVal||autoN,typ:kalTypStr||ktyp2||''});
  termine[date].sort((a,b)=>a.uhr.localeCompare(b.uhr));
  // If Prüfung: add to student's Prüfungen list
  if((AppState.kal.typ||"normal")==="pruef"&&!sid.startsWith("__auffrisch__")){
    const ps=getS(sid);
    if(ps){
      if(!ps.pruefungen)ps.pruefungen=[];
      const prufort=document.getElementById("k-prufort")?document.getElementById("k-prufort").value:ps.prufort;
      const versuch=(ps.pruefungen.length+1);
      // Always update/add pruefung for this date+uhr
      const existIdx=ps.pruefungen.findIndex(p=>p.datum===date&&p.uhr===uhr);
      if(existIdx>=0){
        ps.pruefungen[existIdx].prufort=prufort;
      } else {
        ps.pruefungen.push({datum:date,uhr,versuch:0,bestanden:null,prufort});
        ps.pruefungen.sort((a,b)=>a.datum.localeCompare(b.datum));
        // Assign versuch numbers in chronological order
        ps.pruefungen.forEach((p,i)=>{if(p.versuch===0)p.versuch=i+1;});
      }
    }
  }
  saveAll();
  selDate=date;
  renderTagAnsicht(date);
  }catch(e){document.getElementById("app").innerHTML=`<div style="padding:20px;color:red">Fehler: ${e.message}</div>`;}
}

function renderStatistik(){
  syncKalenderToFahrstunden();
  const alle=schueler.flatMap(s=>{
    const sorted=(s.pruefungen||[]).slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
    return sorted.map((p,i)=>({...p,versuch:i+1,sid:s.id,name:s.vorname+" "+s.nachname,klasse:s.klasse,prufort:p.prufort||s.prufort})).filter(p=>p.bestanden!==null&&p.bestanden!==undefined);
  });
  const alleInklOffen=schueler.flatMap(s=>{
    const sorted=(s.pruefungen||[]).slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
    return sorted.map((p,i)=>({...p,versuch:i+1,sid:s.id,name:s.vorname+" "+s.nachname,klasse:s.klasse,prufort:p.prufort||s.prufort}));
  });
  const gesamt=alle.length;
  const bestanden=alle.filter(p=>p.bestanden).length;
  const quote=gesamt?Math.round((bestanden/gesamt)*100):0;
  const v=[1,2,3,4].map(n=>({n,list:alle.filter(p=>p.versuch===n)}));
  const ortStats=PRUFORTE.map(o=>{
    const ps=alle.filter(p=>(p.prufort||"")===o);
    const tot=ps.length,best=ps.filter(p=>p.bestanden).length;
    return{ort:o,tot,best,quote:tot?Math.round((best/tot)*100):null};
  }).filter(o=>o.tot>0);
  const td2=todayStr();
  // Alle Prüfungen (offen + abgeschlossen) rein chronologisch, älteste zuerst
  const _pruefPending=alleInklOffen.filter(p=>p.bestanden===null||p.bestanden===undefined).sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
  const _pruefDone=alleInklOffen.filter(p=>!(p.bestanden===null||p.bestanden===undefined)).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const alleSortiert=[..._pruefPending,..._pruefDone];

  let html=`<div class="screen active" id="scr-stat">
    <div class="topbar">
      <button class="btn-icon" onclick="renderDashboard()"><i class="ti ti-arrow-left"></i></button>
      <span class="topbar-title">Statistik</span>
    </div>
    <div class="scroll">
      <div class="stat-grid">
        <div class="stat-box accent" style="text-align:center"><div class="stat-lbl">Bestehensquote</div><div class="stat-num" style="font-size:55px">${quote}<span class="stat-unit">%</span></div></div>
        <div class="stat-box" style="text-align:center"><div class="stat-lbl">Prüfungen gesamt</div><div class="stat-num" style="font-size:55px">${gesamt}</div></div>
      </div>
      <div class="stat-grid">
        <div class="stat-box" style="text-align:center;cursor:pointer" onclick="renderStatPruefListe('best')"><div class="stat-lbl">Bestanden</div><div class="stat-num" style="font-size:55px;color:var(--ok-tx)">${bestanden}</div></div>
        <div class="stat-box" style="text-align:center;cursor:pointer" onclick="renderStatPruefListe('nicht')"><div class="stat-lbl">Nicht bestanden</div><div class="stat-num" style="font-size:55px;color:var(--bad-tx)">${gesamt-bestanden}</div></div>
      </div>`;

  if(gesamt===0){
    html+=`<div class="empty-hint"><i class="ti ti-chart-bar" style="font-size:37px;display:block;margin:0 auto 10px"></i>Noch keine Prüfungsdaten.<br>Ergebnisse über das Dashboard eintragen.</div>`;
  }else{
    html+=`<div><div class="sec-label">Nach Prüfungsversuch</div><div class="stat-card">`;
    v.filter(x=>x.list.length>0).forEach(x=>{
      const best=x.list.filter(p=>p.bestanden).length;
      const pct=x.list.length?Math.round((best/x.list.length)*100):0;
      html+=`<div class="stat-bar-wrap" style="margin-bottom:14px;padding:4px 0"><span class="stat-bar-label" style="font-size:17px">${x.n}.</span><div class="stat-bar-bg" style="height:12px;border-radius:6px"><div class="stat-bar-fill" style="height:12px;border-radius:6px;width:${pct}%"></div></div><span class="stat-bar-val" style="font-size:16px">${pct}%</span><span style="font-size:14px;color:var(--tx3);min-width:36px">${best}/${x.list.length}</span></div>`;
    });
    html+=`</div></div>`;
    if(ortStats.length){
      html+=`<div><div class="sec-label">Nach Prüfort</div><div class="stat-card">`;
      ortStats.forEach(o=>{
        html+=`<div class="stat-bar-wrap" style="margin-bottom:14px;padding:4px 0"><span class="stat-bar-label" style="min-width:90px;font-size:15px">${o.ort.replace("DEKRA ","").replace("TÜV ","")}</span><div class="stat-bar-bg" style="height:12px;border-radius:6px"><div class="stat-bar-fill" style="height:12px;border-radius:6px;width:${o.quote}%"></div></div><span class="stat-bar-val" style="font-size:16px">${o.quote}%</span><span style="font-size:14px;color:var(--tx3);min-width:36px">${o.best}/${o.tot}</span></div>`;
      });
      html+=`</div></div>`;
    }
    if(alleSortiert.length){
      const upcomingCount=alleSortiert.filter(p=>p.datum>=td2&&(p.bestanden===null||p.bestanden===undefined)).length;
      html+=`<div><div class="sec-label">Alle Prüfungen (chronologisch${upcomingCount?" · "+upcomingCount+" ausstehend":""})</div>`;
      alleSortiert.forEach(p=>{
        const fd=fmtDate(p.datum);
        const pOffen=p.bestanden===null||p.bestanden===undefined;
        const isUpcoming=p.datum>=td2&&pOffen;
        html+=`<div class="pruef-result-item" onclick="renderDashSchueler('${p.sid}')" style="cursor:pointer;padding:14px 16px;gap:14px;${isUpcoming?"border-left:3px solid var(--accent);":""}">
          <div style="width:40px;height:40px;border-radius:50%;flex-shrink:0;text-align:center;line-height:40px;font-size:17px;font-weight:700;${pOffen?"background:rgba(255,107,43,0.15);color:var(--accent);":p.bestanden?"background:var(--ok-bg);color:var(--ok-tx);":"background:var(--bad-bg);color:var(--bad-tx);"}">${p.versuch}</div>
          <div style="flex:1"><div style="font-size:17px;font-weight:600;color:var(--tx)">${p.name}</div>
          <div style="font-size:14px;color:var(--tx2);margin-top:3px">${p.versuch}. Prüfung · ${fd.day}. ${fd.mon} ${fd.year}${p.prufort?" · "+p.prufort:""}</div></div>
          <span style="font-size:21px;color:${pOffen?"var(--accent)":p.bestanden?"var(--ok-tx)":"var(--bad-tx)"}">${pOffen?"⏳":p.bestanden?"✓":"✗"}</span>
        </div>`;
      });
      html+=`</div>`;
    }
  }
  html+=`</div></div>`;
  renderApp(html);
  setTimeout(initPTR,50);
}

function renderStatPruefListe(typ){
  const wantBest=typ==='best';
  const list=schueler.flatMap(s=>{
    const sorted=(s.pruefungen||[]).slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
    return sorted.map((p,i)=>({...p,versuch:i+1,sid:s.id,name:s.vorname+" "+s.nachname,prufort:p.prufort||s.prufort})).filter(p=>p.bestanden===(wantBest?true:false));
  }).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const titel=wantBest?'Bestanden':'Nicht bestanden';
  const farbe=wantBest?'var(--ok-tx)':'var(--bad-tx)';
  const bg=wantBest?'var(--ok-bg)':'var(--bad-bg)';
  const rows=list.length?list.map(p=>{
    const fd=fmtDate(p.datum);
    return `<div class="pruef-result-item" onclick="renderDashSchueler('${p.sid}')" style="cursor:pointer;padding:14px 16px;gap:14px">
      <div style="width:40px;height:40px;border-radius:50%;flex-shrink:0;text-align:center;line-height:40px;font-size:17px;font-weight:700;background:${bg};color:${farbe}">${p.versuch}</div>
      <div style="flex:1"><div style="font-size:17px;font-weight:600;color:var(--tx)">${p.name}</div>
      <div style="font-size:14px;color:var(--tx2);margin-top:3px">${p.versuch}. Prüfung · ${fd.day}. ${fd.mon} ${fd.year}${p.prufort?" · "+p.prufort:""}</div></div>
      <span style="font-size:21px;color:${farbe}">${wantBest?'✓':'✗'}</span>
    </div>`;
  }).join(''):`<div class="empty-hint" style="padding:24px 0">Keine Einträge</div>`;
  const html=`<div class="screen active">
    <div class="topbar">
      <button class="btn-icon" onclick="renderStatistik()"><i class="ti ti-arrow-left"></i></button>
      <span class="topbar-title" style="color:${farbe}">${titel} (${list.length})</span>
    </div>
    <div class="scroll">
      ${rows}
      <button class="btn-full" style="margin-top:14px" onclick="renderStatistik()"><i class="ti ti-arrow-left"></i> Zurück zur Statistik</button>
    </div>
  </div>`;
  renderApp(html);
  setTimeout(initPTR,50);
}

function renderEditKalTermin(date,idx){

function ektUpdateEnd(){
  const uhr=document.getElementById("ekt-uhr");
  const endEl=document.getElementById("ekt-endzeit");
  if(!uhr||!endEl)return;
  const [h,m]=uhr.value.split(":").map(Number);
  const total=h*60+m+(AppState.et.min||80);
  const eh=Math.floor(total/60)%24;
  const em=total%60;
  endEl.textContent=String(eh).padStart(2,"0")+":"+String(em).padStart(2,"0")+" Uhr";
}

function setEKTyp(typ){
  AppState.et.typ=typ;
  ["normal","pruef","ueberland","autobahn","nacht","auffrisch"].forEach(t=>{const el=document.getElementById("ektyp-"+t);if(el)el.classList.toggle("active",t===typ);});
  if(typ==="normal"||typ==="auffrisch")AppState.et.min=80;
  else if(typ==="pruef")AppState.et.min=100;
  else if(typ==="ueberland")AppState.et.min=270;
  else if(typ==="autobahn")AppState.et.min=225;
  else if(typ==="nacht")AppState.et.min=135;
  const el=document.getElementById("et-min-disp");if(el)el.textContent=AppState.et.min+" min";
  ektUpdateEnd();
}

function setEKSonder(key,min){
  SONDER.forEach(sf=>{const el=document.getElementById("eksf-"+sf.key);if(el)el.classList.toggle("active",sf.key===key);});
  AppState.et.min=min;
  const el=document.getElementById("et-min-disp");if(el)el.textContent=min+" min";
  ektUpdateEnd();
}

function saveEktTermin(date,idx){
  if(!termine[date]||!termine[date][idx])return;
  const isAuffrisch3=AppState.et.isAuffrisch||false;
  const ekTag=document.getElementById('ekt-dat-tag').value;
  const ekMon=document.getElementById('ekt-dat-mon').value;
  const ekJahr=document.getElementById('ekt-dat-jahr').value;
  const newDate=(ekTag&&ekMon&&ekJahr)?ekJahr+'-'+String(ekMon).padStart(2,'0')+'-'+String(ekTag).padStart(2,'0'):date;
  const entry=termine[date][idx];
  const isTheorieE=AppState.et.isTheorie||entry.typ==="theorie"||(entry.sid&&entry.sid.startsWith("__theorie__"));
  if(isTheorieE){
    const tt=document.getElementById('ekt-theorie-titel');
    const titel=tt&&tt.value.trim()?tt.value.trim():"Theoriestunde";
    entry.sid="__theorie__:"+titel;entry.typ="theorie";
  } else if(!isAuffrisch3){const ektSid=document.getElementById('ekt-sid');if(ektSid)entry.sid=ektSid.value;}
  entry.uhr=document.getElementById("ekt-uhr").value;
  entry.min=AppState.et.min||80;
  if(AppState.et.typ)entry.typ=AppState.et.typ;
  entry.notiz=document.getElementById("ekt-notiz").value.trim();
  // Move to new date if changed
  if(newDate!==date){
    termine[date].splice(idx,1);
    if(!termine[date].length)delete termine[date];
    if(!termine[newDate])termine[newDate]=[];
    termine[newDate].push(entry);
    termine[newDate].sort((a,b)=>a.uhr.localeCompare(b.uhr));
  } else {
    termine[date].sort((a,b)=>a.uhr.localeCompare(b.uhr));
  }
  // If Prüfung type: sync to student's pruefungen
  if(entry.typ==="pruef"&&!entry.sid.startsWith("__auffrisch__")){
    const ps=getS(entry.sid);
    if(ps){
      if(!ps.pruefungen)ps.pruefungen=[];
      const versuch=(ps.pruefungen.length+1);
      const existIdx=ps.pruefungen.findIndex(p=>p.datum===newDate);
      if(existIdx>=0){
        ps.pruefungen[existIdx].uhr=entry.uhr;
      } else {
        ps.pruefungen.push({datum:newDate,uhr:entry.uhr,versuch:0,bestanden:null,prufort:ps.prufort||""});
        ps.pruefungen.sort((a,b)=>a.datum.localeCompare(b.datum));
        ps.pruefungen.forEach((p,i)=>{if(p.versuch===0)p.versuch=i+1;});
      }
    }
  }
  saveAll();
  selDate=newDate;
  setTimeout(()=>renderTagAnsicht(newDate),100);
}

function deleteEktTermin(date,idx){
  if(!termine[date]||!termine[date][idx])return;
  const t=termine[date][idx];
  const s=getS(t.sid);
  const name=(s?s.vorname+" "+s.nachname:"Termin")+" · "+t.uhr+" Uhr";
  showModal({
    title:"Termin löschen",
    msg:`${name} wirklich löschen?`,
    btns:[
      {label:"Löschen",danger:true,action:`_doDeleteEktTermin('${date}',${idx})`},
      {label:"Abbrechen",action:"closeModal()"},

}

}

    termineTrash.forEach((entry,i)=>{

      const s=(isTheorie||isAuffrisch||!t.sid)?null:getS(t.sid);
      const name=isTheorie?((t.sid&&t.sid.indexOf(":")>=0)?t.sid.split(":").slice(1).join(":"):"Theorie"):isAuffrisch?t.sid.replace("__auffrisch__:",""):(s?s.vorname+" "+s.nachname:"Unbekannt");

// ── SCHALTKOMPETENZ B197 ───────────────────────────────────────────────────
const SCHALT_SOLL=5;
const _schaltExpanded={};
function schaltToggle(sid,ctx){_schaltExpanded[sid]=!_schaltExpanded[sid];_schaltRer(sid,ctx);}
function schaltCount(s){return Array.isArray(s&&s.schalt)?s.schalt.length:0;}
function _schaltRer(sid,ctx){
  if(ctx&&ctx.indexOf('tag|')===0){const p=ctx.split('|');renderTerminDetail(p[1],parseInt(p[2],10));}
  else renderDashSchueler(sid);
}
function schaltAdd(sid,datum,ctx){
  const s=getS(sid);if(!s)return;
  if(!Array.isArray(s.schalt))s.schalt=[];
  if(s.schalt.length>=SCHALT_SOLL)return;
  s.schalt.push({datum:datum});
  s.schalt.sort((a,b)=>a.datum.localeCompare(b.datum));
  saveAll();
  _schaltExpanded[sid]=false;
  if(navigator.vibrate)navigator.vibrate(8);
  _schaltRer(sid,ctx);
}
function schaltRemove(sid,idx,ctx){
  const s=getS(sid);if(!s||!Array.isArray(s.schalt))return;
  s.schalt.splice(idx,1);
  _schaltExpanded[sid]=false;
  saveAll();
  _schaltRer(sid,ctx);
}
function schaltAddDialog(sid,defaultDatum,ctx){
  const s=getS(sid);if(!s)return;
  if(schaltCount(s)>=SCHALT_SOLL)return;
  const heute=todayStr();
  showModal({
    title:"Schaltfahrstunde nachtragen",
    msg:`Datum der Schaltfahrstunde w&auml;hlen:<div style="margin-top:14px"><input type="date" id="schalt-date-inp" value="${defaultDatum||heute}" max="${heute}" style="width:100%;padding:13px 14px;border:1.5px solid var(--br2);border-radius:var(--r-md);background:var(--bg);color:var(--tx);font-size:18px;font-family:inherit;box-sizing:border-box"/></div>`,
    btns:[
      {label:"Eintragen",primary:true,action:`_schaltAddPicked('${sid}','${ctx}')`},
      {label:"Abbrechen",action:"closeModal()"}
    ]
  });
}
function _schaltAddPicked(sid,ctx){
  const el=document.getElementById("schalt-date-inp");
  const d=el?el.value:"";
  if(!d)return;
  closeModal();
  schaltAdd(sid,d,ctx);
}

function schaltCardHTML(sid,addDatum,ctx){
  const s=getS(sid);if(!s)return'';
  if(!Array.isArray(s.schalt))s.schalt=[];
  const arr=s.schalt;
  const cnt=arr.length;
  const done=cnt>=SCHALT_SOLL;
  const expanded=!!_schaltExpanded[sid];

  // Komplett -> eingeklappt, nur als "erledigt" anzeigen (antippbar)
  if(done&&!expanded){
    return `<div class="card" style="margin-bottom:12px;border-left:3px solid #34C759;cursor:pointer" onclick="schaltToggle('${sid}','${ctx}')">
      <div class="card-row" style="padding:14px 16px;border-bottom:none">
        <span style="display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600"><i class="ti ti-circle-check" style="font-size:22px;color:#34C759"></i>Schaltkompetenz B197</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:9px">
          <span style="font-size:14px;font-weight:700;color:#34C759;background:rgba(52,199,89,.14);padding:4px 11px;border-radius:20px">erledigt &middot; ${cnt}/${SCHALT_SOLL}</span>
          <i class="ti ti-chevron-down" style="color:var(--tx3);font-size:18px"></i>
        </span>
      </div>
    </div>`;
  }

async function exportDaten(){
  const data = { schueler, termine, exportiert: new Date().toISOString() };
  const json = JSON.stringify(data, null, 2);
  const datum = new Date().toISOString().split("T")[0];
  const filename = "fahrschule-backup-"+datum+".json";
  // Web-Share-API bevorzugen: öffnet den nativen iOS-Sharesheet mit "In Dateien sichern",
  // damit die Sicherung direkt z.B. im Ordner "Dokumente" gespeichert werden kann.
  try{
    const file = new File([json], filename, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return;
    }
  }catch(err){
    if(err && err.name==="AbortError")return; // Nutzer hat Sharesheet abgebrochen
  }
  // Fallback: klassischer Blob-Download (Desktop-Browser o.ä.)
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function importDaten(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if(!data.schueler || !data.termine) {
        showModal({title:"Ungültige Datei",msg:"Die Datei enthält keine gültigen Backup-Daten.",btns:[{label:"OK",action:"closeModal()"}]});return;
      }
      showModal({
        title:"Daten wiederherstellen",
        msg:"Alle aktuellen Daten werden durch das Backup ersetzt. Fortfahren?",
        btns:[
          {label:"Wiederherstellen",primary:true,action:"_doImportDaten("+JSON.stringify(JSON.stringify(data))+")"},
          {label:"Abbrechen",action:"closeModal()"},
        ]
      });
    } catch(err) {
      showModal({title:"Fehler",msg:"Fehler beim Einlesen der Datei.",btns:[{label:"OK",action:"closeModal()"}]});
    }
  };
  reader.readAsText(file);
  input.value = "";
}

function syncKalenderToFahrstunden(){
  schueler.forEach(s=>{
    s.fahrstunden=[];
    // sonder bleibt manuell — wird nicht aus Terminen berechnet
    if(!s.sonder||Array.isArray(s.sonder))s.sonder={ueberland:0,autobahn:0,nacht:0};
    Object.entries(termine).forEach(([datum,ts])=>{
      ts.filter(t=>t.sid===s.id).forEach(t=>{
        const typ=t.typ||"normal";
        s.fahrstunden.push({datum,uhr:t.uhr,min:t.min,typ,einh:1,notiz:t.notiz||""});
      });
    });
    s.fahrstunden.sort((a,b)=>b.datum.localeCompare(a.datum)||(b.uhr||"").localeCompare(a.uhr||""));
  });
}

function pruefungEintragen(sid, bestanden){
  const s=getS(sid);if(!s)return;
  if(!s.pruefungen)s.pruefungen=[];
  const td=todayStr();
  // Find existing open pruefung or use today
  const existing=s.pruefungen.find(p=>p.bestanden===null||p.bestanden===undefined);
  if(existing){
    existing.bestanden=bestanden;
  } else {
    // Check if there's a pruef termin today or most recent
    const pruefTermin=Object.entries(termine)
      .sort((a,b)=>b[0].localeCompare(a[0]))
      .flatMap(([d,ts])=>ts.filter(t=>t.sid===sid&&t.typ==='pruef').map(t=>({...t,datum:d})))
      [0];
    const datum=pruefTermin?pruefTermin.datum:td;
    s.pruefungen.push({datum,versuch:s.pruefungen.length+1,bestanden,prufort:s.prufort||''});
  }
  s.pruefungen.sort((a,b)=>a.datum.localeCompare(b.datum));
  saveAll();
  renderDashSchueler(sid);
}

function resetPruefErgebnis(sid,datum){
  const s=getS(sid);if(!s)return;
  const p=(s.pruefungen||[]).find(p=>p.datum===datum);
  if(p){p.bestanden=null;}
  saveAll();
  renderDashSchueler(sid);
}

function setPruefErgebnis(sid,datum,bestanden){
  const s=getS(sid);if(!s)return;
  if(!s.pruefungen)s.pruefungen=[];
  const p=s.pruefungen.find(p=>p.datum===datum);
  if(p){
    if(bestanden===null){delete p.bestanden;p.bestanden=null;}
    else{p.bestanden=bestanden;}
  } else if(bestanden!==null){
    s.pruefungen.push({datum,versuch:1,bestanden,prufort:s.prufort||""});
  }
  saveAll();
  syncKalenderToFahrstunden();
  renderDashSchueler(sid);
}

function toggleNotizBadge(sid,returnDate){
  const s=getS(sid);if(!s)return;
  const gefahrenCount=Object.entries(termine).flatMap(([d,ts])=>ts.filter(t=>t.sid===sid&&_terminVorbei(d,t.uhr,t.min))).length;
  let lines=(s.notizen&&s.notizen.length)?s.notizen.map(n=>n.text):[];
  for(let i=lines.length+1;i<=gefahrenCount;i++){lines.push(i+". ");}
  if(!lines.length)lines=["1. "];
  const text=lines.join('\n');
  const html=`<div class="screen active">
    <div class="topbar">
